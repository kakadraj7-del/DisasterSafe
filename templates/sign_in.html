<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="DisasterSafe - Sign in">

    <title>Sign In - DisasterSafe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/sign_in.css') }}">

</head>


<body>

    <main class="signin-page">

        <div class="signin-card">

            <!-- Logo / Brand -->

            <div class="signin-brand">

                <div class="brand-icon">
                    !
                </div>

                <h1>
                    DisasterSafe
                </h1>

            </div>


            <!-- Heading -->

            <div class="signin-heading">

                <h2>
                    Create Your Account
                </h2>

                <p>
                    Sign up to access DisasterSafe features.
                </p>

            </div>


            <!-- Sign In Form -->

            <form
                action="{{ url_for('sign_in') }}"
                method="POST"
                class="signin-form"
            >

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Location -->

                <div class="form-group">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter your city / location"
                        autocomplete="address-level2"
                        required
                    >

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="signin-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Back to Home -->

            <a
                href="{{ url_for('sign_in') }}"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </main>

    <script src="{{ url_for('static', filename='js/sign_in.js') }}"></script>

</body>

</html>
