
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Disaster Information - DisasterSafe</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/preparedness_info.css') }}">

</head>


<body>


<!-- Header -->

<header class="header">

    <div class="container header-content">

        <a href="#" class="PIbrand">
                <span class="PIbrand-icon">!</span>
                <span>Disaster<span>Safe</span></span>
            </a>

        <nav class="navbar">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('preparedness') }}"
               class="active">

                Preparedness

            </a>

            <a href="{{ url_for('guidelines') }}">
                Guidelines
            </a>

            <a href="{{ url_for('emergency_contacts') }}">
                Emergency
            </a>

        </nav>

    </div>

</header>



<!-- Main Content -->

<main>


    <!-- Disaster Heading -->

    <section class="disaster-hero">

        <div class="container">

            <div class="disaster-icon"
                 id="disaster-icon">

                🌊

            </div>


            <p class="section-label">
                DISASTER SAFETY
            </p>


            <h1 id="disaster-title">
                Loading...
            </h1>


            <p class="disaster-description"
               id="disaster-description">

                Loading disaster information...

            </p>

        </div>

    </section>



    <!-- Safety Information -->

    <section class="safety-section">

        <div class="container">

            <div class="safety-grid">


                <!-- Before -->

                <article class="safety-card">

                    <div class="safety-card-header">

                        <div class="safety-icon">
                            🛡️
                        </div>

                        <div>

                            <p class="card-label">
                                PREPARE
                            </p>

                            <h2>
                                Before
                            </h2>

                        </div>

                    </div>


                    <!-- JavaScript will insert
                         Before information here -->

                    <ul id="before-list">
                    </ul>

                </article>



                <!-- During -->

                <article class="safety-card">

                    <div class="safety-card-header">

                        <div class="safety-icon">
                            🚨
                        </div>

                        <div>

                            <p class="card-label">
                                RESPOND
                            </p>

                            <h2>
                                During
                            </h2>

                        </div>

                    </div>


                    <!-- JavaScript will insert
                         During information here -->

                    <ul id="during-list">
                    </ul>

                </article>



                <!-- After -->

                <article class="safety-card">

                    <div class="safety-card-header">

                        <div class="safety-icon">
                            ✅
                        </div>

                        <div>

                            <p class="card-label">
                                RECOVER
                            </p>

                            <h2>
                                After
                            </h2>

                        </div>

                    </div>


                    <!-- JavaScript will insert
                         After information here -->

                    <ul id="after-list">
                    </ul>

                </article>


            </div>

        </div>

    </section>



    <!-- Back Button -->

    <section class="back-section">

        <div class="container">

            <a href="{{ url_for('preparedness') }}"
               class="back-button">

                ← Back to Preparedness

            </a>

        </div>

    </section>


</main>



<!-- Footer -->

<footer class="footer">

    <div class="container">

        <p>
            © 2026 DisasterSafe.
            Disaster Preparedness & Awareness System.
        </p>

    </div>

</footer>



<!-- JavaScript -->

<script src="{{ url_for('static', filename='js/preparedness_info.js') }}">
</script>


</body>

</html>
